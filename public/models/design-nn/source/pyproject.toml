[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powersynth-layout"
version = "0.2.0"
description = "Constrained single-layer power-module layout generation and PEEC loop ranking"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "networkx>=3", "numba>=0.58"]

[project.optional-dependencies]
test = ["pytest>=7"]
optimization = ["deap>=1.4.3,<2"]
reports = ["matplotlib>=3.8", "threadpoolctl>=3"]

[project.scripts]
powersynth-layout = "powersynth_layout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
